buildscript {
    ext {
        compileSdk_version = 36
        minSdk_version = 21
        targetSdk_version = 36

        gradle_version = '8.13.0'
        compose_version = '1.5.10'
        kotlin_version = '2.1.20'
        ktx_version = '1.17.0'
        appCompat_version = '1.7.1'
        material_version = '1.13.0'
        constraintLayout_version = '2.2.1'
        lifecycle_version = '2.9.4'
        koin_version = '4.1.1'
        navigation_version = '2.9.5'
        composeBom_version = '2024.02.01'
        composeThemeAdapter_version = '1.2.1'
        splashScreen_version = '1.0.1'
        preferences_version = '1.1.7'

        junit_version = '4.13.2'
        testExtJunit = '1.3.0'
        espresso_version = '3.7.0'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$navigation_version"
    }

}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}